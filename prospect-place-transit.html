<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transit · 1485 Prospect Pl</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   CONFIG  —  free key at https://api.mta.info
══════════════════════════════════════════ */
:root { --api-key: "YOUR_MTA_API_KEY_HERE"; }

:root {
  --font: 'Figtree', sans-serif;
  --t1: #ffffff;
  --t2: rgba(255,255,255,0.45);
  --t3: rgba(255,255,255,0.45);
  --row-bg: rgba(0,0,0,0.45);
  --row-bd: rgba(255,255,255,0.09);
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

html, body {
  background: transparent !important;
  font-family: var(--font);
  color: var(--t1);
  width: 100%;
  -webkit-font-smoothing: antialiased;
}

.board {
  padding: 4px 4px 6px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ── section label ──────────────────────── */
.sec-label {
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--t3);
  padding: 12px 4px 6px;
}

/* ── row ────────────────────────────────── */
/* Layout: [bullet] [dir+dest stacked] [chips] 
   Key fix: dest shrinks, never truncates — we just make it smaller */
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: var(--row-bg);
  border: 1px solid var(--row-bd);
  border-radius: 10px;
  margin-bottom: 4px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  animation: pop .18s ease both;
}
@keyframes pop { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }

/* ── subway bullet ──────────────────────── */
.bullet {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 900;
  flex-shrink: 0;
  line-height: 1;
}

/* ── bus badge ──────────────────────────── */
.bus-badge {
  border-radius: 8px;
  height: 38px;
  min-width: 64px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 900;
  flex-shrink: 0;
  background: #F2A900;
  color: #000;
  letter-spacing: -0.2px;
}

/* ── destination block ──────────────────── */
.dest {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.dest-dir {
  font-size: 10px;
  font-weight: 800;
  color: var(--t3);
  letter-spacing: 1px;
  text-transform: uppercase;
  line-height: 1;
}
/* Full destination — NO truncation, wraps if needed */
.dest-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--t1);
  line-height: 1.25;
  /* allow wrap so nothing gets cut off */
  white-space: normal;
  word-break: break-word;
}

/* ── time chips ─────────────────────────── */
.chips {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-shrink: 0;
  align-items: flex-end;
}
.chip {
  min-width: 58px;
  height: 28px;
  padding: 0 10px;
  border-radius: 7px;
  font-size: 14px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.11);
  color: var(--t1);
  letter-spacing: -0.2px;
  white-space: nowrap;
}
.chip.now  { background: rgba(74,222,128,0.25); color: #86efac; }
.chip.soon { background: rgba(250,204,21,0.25);  color: #fde68a; }

/* ── gap between sections ───────────────── */
.section-gap { height: 6px; }

/* ── status ─────────────────────────────── */
.status {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 4px 2px;
  font-size: 10px; font-weight: 700;
  color: var(--t3);
  letter-spacing: 0.3px;
}
.dot { width:5px; height:5px; border-radius:50%; background:#4ade80; animation:blink 2.4s ease-in-out infinite; flex-shrink:0; }
.dot.spin { background:#fbbf24; animation:spin .9s linear infinite; }
.dot.err  { background:#f87171; animation:none; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
@keyframes spin  { to{transform:rotate(360deg)} }

/* ── api banner ─────────────────────────── */
.banner {
  background: rgba(250,204,21,.10);
  border: 1px solid rgba(250,204,21,.25);
  border-radius: 9px;
  padding: 9px 13px;
  font-size: 11px; font-weight: 700;
  color: #fde68a; line-height: 1.8;
  margin-bottom: 8px;
}
.banner a { color:#fcd34d; font-weight:800; }
.banner code { background:rgba(255,255,255,.10); padding:1px 5px; border-radius:4px; font-size:10px; font-family:monospace; }

.empty { font-size:12px; font-weight:700; color:var(--t3); padding:6px 4px; font-style:italic; }
</style>
</head>
<body>
<div class="board">
  <div id="banner-slot"></div>

  <div class="sec-label">Subway · Crown Hts–Utica Av &amp; Utica Av (A/C)</div>
  <div id="subway-rows"></div>

  <div class="section-gap"></div>

  <div class="sec-label">Bus · Buffalo Av · St Johns Pl · Eastern Pkwy</div>
  <div id="bus-rows"></div>

  <div class="status">
    <div class="dot spin" id="dot"></div>
    <span id="stxt">Loading…</span>
  </div>
</div>

<script>
/* ════════════════════════════════════════
   CONFIG  —  https://api.mta.info (free)
════════════════════════════════════════ */
const API_KEY     = "YOUR_MTA_API_KEY_HERE";
const REFRESH_SEC = 30;
const MAX         = 2;

/* Subway stop IDs */
const SUBWAY_STOPS = [
  { id:"232N", dir:"Uptown",   dest:"Manhattan" },
  { id:"232S", dir:"Downtown", dest:"New Lots / Flatbush" },
  { id:"A27N", dir:"Uptown",   dest:"Manhattan / Inwood" },
  { id:"A27S", dir:"Downtown", dest:"Far Rockaway / Lefferts" },
];

/* Bus Time stop codes */
const BUS_STOPS = ["308394","305720","308207"];

/* MTA line colors */
const L = {
  "1":{bg:"#EE352E",fg:"#fff"},"2":{bg:"#EE352E",fg:"#fff"},"3":{bg:"#EE352E",fg:"#fff"},
  "4":{bg:"#00933C",fg:"#fff"},"5":{bg:"#00933C",fg:"#fff"},
  "A":{bg:"#2850AD",fg:"#fff"},"C":{bg:"#2850AD",fg:"#fff"},"E":{bg:"#2850AD",fg:"#fff"},
  "N":{bg:"#FCCC0A",fg:"#000"},"Q":{bg:"#FCCC0A",fg:"#000"},"R":{bg:"#FCCC0A",fg:"#000"},"W":{bg:"#FCCC0A",fg:"#000"},
  "B":{bg:"#FF6319",fg:"#fff"},"D":{bg:"#FF6319",fg:"#fff"},"F":{bg:"#FF6319",fg:"#fff"},"M":{bg:"#FF6319",fg:"#fff"},
  "G":{bg:"#6CBE45",fg:"#fff"},"J":{bg:"#996633",fg:"#fff"},"Z":{bg:"#996633",fg:"#fff"},
  "L":{bg:"#A7A9AC",fg:"#fff"},"7":{bg:"#B933AD",fg:"#fff"},"S":{bg:"#808183",fg:"#fff"},
};

const fmt = s => { const m=Math.round(s/60); return m<=0?"Now":m+" min"; };
const chipCls = l => l==="Now"?"chip now":(!isNaN(parseInt(l))&&parseInt(l)<=3)?"chip soon":"chip";

function chipsCol(labels) {
  return `<div class="chips">${labels.map(l=>`<div class="${chipCls(l)}">${l}</div>`).join('')}</div>`;
}

function subwayRow(route, dir, dest, labels) {
  const m = L[route]||{bg:"#555",fg:"#fff"};
  return `<div class="row">
    <div class="bullet" style="background:${m.bg};color:${m.fg}">${route}</div>
    <div class="dest">
      <div class="dest-dir">${dir}</div>
      <div class="dest-name">${dest}</div>
    </div>
    ${chipsCol(labels)}
  </div>`;
}

function busRow(route, dest, labels) {
  return `<div class="row">
    <div class="bus-badge">${route}</div>
    <div class="dest">
      <div class="dest-dir">Local Bus</div>
      <div class="dest-name">${dest}</div>
    </div>
    ${chipsCol(labels)}
  </div>`;
}

/* ── fetch ──────────────────────────────── */
async function getSubway() {
  const ids = SUBWAY_STOPS.map(s=>s.id).join(',');
  const r = await fetch(`https://api.mta.info/v2/schedule/${ids}?key=${API_KEY}`);
  if (!r.ok) throw new Error("subway "+r.status);
  return r.json();
}
async function getBus(code) {
  const r = await fetch(
    `https://bustime.mta.info/api/siri/stop-monitoring.json`+
    `?key=${API_KEY}&OperatorRef=MTA&MonitoringRef=${code}&MaximumStopVisits=8`
  );
  if (!r.ok) throw new Error("bus "+r.status);
  return r.json();
}

/* ── render subway ──────────────────────── */
function renderSubway(data) {
  const now = Date.now()/1000;
  const stopMeta = {};
  SUBWAY_STOPS.forEach(s => stopMeta[s.id] = {dir:s.dir, dest:s.dest, byRoute:{}});

  (data?.trips||[]).forEach(trip => {
    const route = trip.route_id;
    (trip.stop_time_updates||[]).forEach(stu => {
      const t = stu.arrival?.time || stu.departure?.time;
      if (!t) return;
      const d = t - now;
      if (d < -30 || d > 3600) return;
      const sm = stopMeta[stu.stop_id];
      if (!sm) return;
      if (!sm.byRoute[route]) sm.byRoute[route] = [];
      sm.byRoute[route].push(d);
    });
  });

  const rows = [];
  SUBWAY_STOPS.forEach(s => {
    const sm = stopMeta[s.id];
    Object.entries(sm.byRoute).forEach(([route, times]) => {
      times.sort((a,z)=>a-z);
      rows.push({route, dir:sm.dir, dest:sm.dest, times});
    });
  });
  rows.sort((a,b)=>(a.times[0]||9999)-(b.times[0]||9999));

  document.getElementById('subway-rows').innerHTML = rows.length
    ? rows.map(r => subwayRow(r.route, r.dir, r.dest, r.times.slice(0,MAX).map(fmt))).join('')
    : '<div class="empty">No trains scheduled</div>';
}

/* ── render bus ─────────────────────────── */
function renderBus(allData) {
  const now = Date.now();
  const buckets = {};
  allData.forEach(data => {
    const visits = data?.Siri?.ServiceDelivery?.StopMonitoringDelivery?.[0]?.MonitoredStopVisit||[];
    visits.forEach(v => {
      const mvj = v.MonitoredVehicleJourney;
      const route = (mvj?.PublishedLineName||mvj?.LineRef||'?').replace(/^MTA[^_]*_/,'');
      const dest = mvj?.DestinationName||'In service';
      const rawT = mvj?.MonitoredCall?.ExpectedArrivalTime||mvj?.MonitoredCall?.AimedArrivalTime;
      if (!rawT) return;
      const d = (new Date(rawT)-now)/1000;
      if (d<-30||d>3600) return;
      if (!buckets[route]) buckets[route]={route,dest,times:[]};
      buckets[route].times.push(d);
    });
  });
  Object.values(buckets).forEach(b=>b.times.sort((a,z)=>a-z));
  const rows = Object.values(buckets)
    .sort((a,b)=>(a.times[0]||9999)-(b.times[0]||9999)).slice(0,6);

  document.getElementById('bus-rows').innerHTML = rows.length
    ? rows.map(b=>busRow(b.route,b.dest,b.times.slice(0,MAX).map(fmt))).join('')
    : '<div class="empty">No buses scheduled</div>';
}

/* ── demo ───────────────────────────────── */
function demo() {
  document.getElementById('banner-slot').innerHTML = `<div class="banner">
    ✨ <strong>Add your MTA key for live arrivals</strong><br>
    Register free → <a href="https://api.mta.info" target="_blank">api.mta.info</a>
    · open this file, replace <code>YOUR_MTA_API_KEY_HERE</code>, save &amp; reload.
  </div>`;

  document.getElementById('subway-rows').innerHTML = [
    subwayRow("4","Uptown",   "Manhattan",               ["2 min","9 min"]),
    subwayRow("3","Uptown",   "Manhattan",               ["5 min","13 min"]),
    subwayRow("A","Uptown",   "Manhattan / Inwood",      ["3 min","11 min"]),
    subwayRow("C","Uptown",   "168 St / Manhattan",      ["7 min","18 min"]),
    subwayRow("4","Downtown", "New Lots Av",             ["Now","8 min"]),
    subwayRow("3","Downtown", "New Lots Av",             ["4 min","12 min"]),
    subwayRow("A","Downtown", "Far Rockaway / Lefferts", ["6 min","14 min"]),
    subwayRow("C","Downtown", "Euclid Av",               ["10 min","21 min"]),
  ].join('');

  document.getElementById('bus-rows').innerHTML = [
    busRow("B65","Fulton Mall / Downtown Bklyn", ["3 min","11 min"]),
    busRow("B45","Court St / Downtown Bklyn",    ["6 min","15 min"]),
    busRow("B46","Williamsburg Bridge",           ["Now","12 min"]),
    busRow("B14","New Utrecht Av",               ["7 min","19 min"]),
    busRow("B17","Flatbush Av",                  ["9 min","22 min"]),
  ].join('');

  setStatus('err','Demo mode · add your MTA key above for live data');
}

/* ── status / loop ──────────────────────── */
const dotEl  = document.getElementById('dot');
const stxtEl = document.getElementById('stxt');
function setStatus(s,msg) {
  dotEl.className = 'dot'+(s==='ok'?'':s==='loading'?' spin':' err');
  stxtEl.textContent = msg;
}

async function refresh() {
  if (!API_KEY || API_KEY==="YOUR_MTA_API_KEY_HERE") { demo(); return; }
  document.getElementById('banner-slot').innerHTML='';
  setStatus('loading','Refreshing…');
  try {
    const [sub,...buses] = await Promise.all([getSubway(),...BUS_STOPS.map(getBus)]);
    renderSubway(sub); renderBus(buses);
    const t = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    setStatus('ok',`Live · ${t}`);
  } catch(e) {
    console.error(e);
    setStatus('err','Fetch error — retrying…');
  }
}

refresh();
setInterval(refresh, REFRESH_SEC*1000);
</script>
</body>
</html>
